on:
  schedule:
    - cron: '30 00,4,8,12,16,20 * * *'  # sync every 4 hours
  workflow_dispatch:

name: sync

jobs:
  sync:
    runs-on: [ubuntu-latest]
    permissions:
      # for commit changes
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v1
      with:
        submodules: true

    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false

    - name: Restore HCLI cache
      uses: actions/cache@v4
      with:
        path: .cache/hcli
        key: hcli-cache-${{ github.run_id }}
        restore-keys: |
          hcli-cache-

    - name: snapshot repo
      # With HCLI_DEBUG set, hcli logs each archive with no valid plugin to stderr. tee keeps a
      # copy of the log for the "update ignored URLs" step. `shell: bash` sets pipefail, so the
      # step still fails when hcli fails. Keep uvx on the first line of the script:
      # scripts/summarize_github_indexer_logs.py looks for "Run uvx --from ida-hcli" to find
      # the log of this step.
      shell: bash
      run: |
          uvx --from ida-hcli hcli plugin --repo github --with-repos-list=known-repositories.txt --with-ignored-repos-list=ignored-repositories.txt --with-ignored-urls-list=ignored-urls.txt repo snapshot 2>&1 > plugin-repository.json | tee hcli.log
          cat plugin-repository.json
          git diff plugin-repository.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HCLI_CACHE_DIR: .cache/hcli
        HCLI_DISABLE_UPDATES: 1
        HCLI_DEBUG: 1
        TTY_COMPATIBLE: 0
        TTY_INTERACTIVE: 0

    - name: update ignored URLs
      run: |
          uv run scripts/update_ignored_urls.py hcli.log ignored-urls.txt
          git diff ignored-urls.txt

    - name: update known repositories
      run: |
          # Extract GitHub repository URLs from plugin-repository.json
          repos=$(jq -r '.plugins[].host' plugin-repository.json | \
              grep '^https://github.com/' | \
              sed 's|https://github.com/||' | \
              tr '[:upper:]' '[:lower:]' | \
              sort -u)

          # Read existing known repositories (excluding empty lines and comments)
          existing=$(grep -v '^#' known-repositories.txt | grep -v '^[[:space:]]*$' | tr '[:upper:]' '[:lower:]' | sort -u)

          # Find new repositories (those in plugin-repository.json but not in known-repositories.txt)
          new_repos=$(comm -23 <(echo "$repos") <(echo "$existing"))

          # Append new repositories if any were found
          if [ -n "$new_repos" ]; then
              echo "Found $(echo "$new_repos" | wc -l) new repositories to add:"
              echo "$new_repos" | sed 's/^/  /'
              echo "" >> known-repositories.txt
              echo "# Discovered on $(date '+%Y-%m-%d %H:%M:%S')" >> known-repositories.txt
              echo "$new_repos" >> known-repositories.txt
              echo "Successfully appended new repositories to known-repositories.txt"
          else
              echo "No new repositories found"
          fi

          git diff known-repositories.txt

    - name: commit
      run: |
        git config --global user.email "bot@example.com"
        git config --global user.name "Hex-Rays (GH Action)"
        git add plugin-repository.json known-repositories.txt ignored-urls.txt

        # Generate commit messages with changes summary
        SUBJECT=$(uv run scripts/summarize_changes.py --short 2>/dev/null || echo "sync plugin-repository.json")
        BODY=$(uv run scripts/summarize_changes.py 2>/dev/null || echo "")

        if [ -n "$BODY" ]; then
          git commit -m "$SUBJECT" -m "$BODY" || echo "no changes"
        else
          git commit -m "$SUBJECT" || echo "no changes"
        fi

    - name: push
      uses: ad-m/github-push-action@master
