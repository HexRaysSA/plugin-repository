on:
  schedule:
    - cron: '30 00,4,8,12,16,20 * * *'  # sync every 4 hours
  workflow_dispatch:

name: sync

jobs:
  sync:
    runs-on: [ubuntu-latest]
    permissions:
      # for commit changes
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v1
      with:
        submodules: true

    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false

    - name: snapshot repo
      run: |
          uvx --from ida-hcli hcli plugin --repo github --with-repos-list=known-repositories.txt --with-ignored-repos-list=ignored-repositories.txt repo snapshot > plugin-repository.json
          cat plugin-repository.json
          git diff plugin-repository.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HCLI_DISABLE_UPDATES: 1
        TTY_COMPATIBLE: 0
        TTY_INTERACTIVE: 0

    - name: commit
      run: |
        git config --global user.email "bot@example.com"
        git config --global user.name "Hex-Rays (GH Action)"
        git add plugin-repository.json

        # Generate commit messages with changes summary
        SUBJECT=$(uv run scripts/summarize_changes.py --short 2>/dev/null || echo "sync plugin-repository.json")
        BODY=$(uv run scripts/summarize_changes.py 2>/dev/null || echo "")

        if [ -n "$BODY" ]; then
          git commit -m "$SUBJECT" -m "$BODY" || echo "no changes"
        else
          git commit -m "$SUBJECT" || echo "no changes"
        fi

    - name: push
      uses: ad-m/github-push-action@master
