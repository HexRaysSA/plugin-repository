name: Deploy content to GitHub Pages

on:
  push:
    branches: ["v1"]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'  # rebuild daily at 5:30 UTC

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      # - name: Install Hugo CLI
      #   run: |
      #     wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
      #     && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Collect content
        run: |
          mkdir -p ./public/
          cp plugin-repository.json ./public/plugin-repository.json
          cp tags.json ./public/tags.json
        
      - name: Mirror plugin content
        run: |
          mkdir -p ./public/plugins/
          uv run scripts/mirror_plugin_archive_contents.py --no-cache plugin-repository.json public/plugins/

      - name: Fetch star counts
        run: |
          mkdir -p ./public/plugins/
          uv run scripts/snapshot_github_repo_metadata.py plugin-repository.json public/plugins/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Build with Hugo
      #   env:
      #     HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
      #     HUGO_ENVIRONMENT: production
      #   run: |
      #     hugo \
      #       --minify \
      #       --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
