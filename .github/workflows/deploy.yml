name: Deploy content to GitHub Pages

on:
  workflow_run:
    workflows: ["sync"]
    types:
      - completed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      HUGO_VERSION: 0.147.3
    steps:

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Collect content
        run: |
          mkdir -p ./public/
          cp plugin-repository.json ./public/plugin-repository.json
          cp tags.json ./public/tags.json

      - name: Restore plugins cache
        uses: actions/cache@v4
        with:
          path: ./public/plugins
          key: deploy-plugins-${{ github.run_id }}
          restore-keys: |
            deploy-plugins-

      - name: Generate chart
        run: |
          mkdir -p ./public/resources/
          uv run --script scripts/plugin_count_chart.py . public/resources/repo_size.png
        
      - name: Mirror plugin content
        run: |
          mkdir -p ./public/plugins/
          uv run scripts/mirror_plugin_archive_contents.py plugin-repository.json public/plugins/

      - name: Fetch star counts
        run: |
          mkdir -p ./public/plugins/
          uv run scripts/snapshot_github_repo_metadata.py plugin-repository.json public/plugins/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge plugins
        env:
          # Hex-Rays portal API key, used only to read the IDA download catalog
          # (`hcli download --list-tags`) so idaVersions can be capped at the
          # latest released IDA (EA-762). hcli authenticates from this env var
          # automatically. If the secret is unset/invalid the derivation yields
          # nothing and merge_plugins.py falls back to its built-in default —
          # the build never fails on this.
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          HCLI_DISABLE_UPDATES: 1
        run: |
          mkdir -p ./public/plugins/

          # EA-762: derive the latest released IDA from the hcli download catalog.
          # Keeps only numeric ida-pro:X.Y[spN] tags (excludes betas / ida-pro:latest
          # / OS-suffixed dupes) and takes the max.
          latest=$(uvx --from ida-hcli hcli --disable-updates download --list-tags 2>/dev/null \
            | grep -oE 'ida-pro:[0-9]+\.[0-9]+(sp[0-9]+)?\b' | cut -d: -f2 | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Latest released IDA from hcli: $latest"
            export LATEST_RELEASED_IDA="$latest"
          else
            echo "hcli unavailable/unauthenticated; using merge_plugins.py default for LATEST_RELEASED_IDA"
          fi

          uv run --script scripts/merge_plugins.py \
            --hcli plugin-repository.json \
            --tags tags.json \
            --api api-plugins.json \
            --metadata public/plugins/github.com/repositories-metadata.json \
            --mirror-dir public/plugins/ \
            --out public/plugins/

      - name: Summarize logs
        run: |
          mkdir -p ./public/logs/
          uv run scripts/summarize_github_indexer_logs.py --html > public/logs/indexer.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLUMNS: 240

      - name: Generate Hugo site
        run: |
          mkdir -p ./site/content/
          uv run scripts/generate_hugo_site.py public/ site/content/
          cp .github/pages/hugo.toml site/
          cp -r .github/pages/layouts site/layouts

      - name: Hugo build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --source site \
            --baseURL "${{ steps.pages.outputs.base_url }}/_/"

      - name: Collect site
        run: |
          mkdir -p ./public/_/
          rsync -av ./site/public/ ./public/_/
          rm -rf ./site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
